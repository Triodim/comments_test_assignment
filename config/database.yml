default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  url: <%= (ENV["DATABASE_URL"] || "").sub(/\/[^\/\?]+(\?.*)?$/, '/app_test\1') %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
